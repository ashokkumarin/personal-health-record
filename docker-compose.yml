services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phr
      POSTGRES_PASSWORD: phr
      POSTGRES_DB: phr
    ports:
      - "5432:5432"
    volumes:
      - phr-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phr"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://phr:phr@postgres:5432/phr
      JWT_SECRET: ${JWT_SECRET}
      MEDIA_ROOT: /app/media
      API_PORT: ${API_PORT}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      WEB_ORIGIN: ${WEB_ORIGIN}
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - phr-media:/app/media

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      WEB_PORT: ${WEB_PORT}
      API_INTERNAL_URL: http://api:${API_PORT}
    ports:
      - "${WEB_PORT}:${WEB_PORT}"

volumes:
  phr-postgres-data:
  # Uploaded documents/thumbnails/avatars, mounted into the api container at
  # /app/media (see MEDIA_ROOT above). Point this at a host bind mount instead
  # of a named volume if you want the files directly accessible on your
  # homelab server's filesystem, e.g. replace with `./data/media:/app/media`.
  phr-media:
